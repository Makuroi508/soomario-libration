name: offline-tests

# Runs the four network-free validation suites on Linux + Python 3.13, the same
# runtime Railway deploys on. Every dependency (solders, bulk-keychain, pynacl,
# base58) ships a prebuilt cp313 manylinux wheel there, so no Rust toolchain is
# needed — which is why these run cleanly in CI even though bulk-keychain can't
# install on Windows (it publishes a Windows wheel for 3.12 only).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pacifica offline suite (32)
        run: python test_pacifica_offline.py

      - name: Bulk offline suite (44, mainnet + agent signing)
        run: python test_bulk_offline.py

      - name: Fan-out offline suite (13)
        run: python test_fanout_offline.py

      - name: Dashboard offline suite (17)
        run: python test_dashboard_offline.py
